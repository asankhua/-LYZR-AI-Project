name: Keep-alive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          APP_URL: ${{ secrets.APP_URL }}
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$KEEPALIVE_TOKEN" ]; then
            echo "APP_URL or KEEPALIVE_TOKEN is not set. Skipping the ping."
            exit 0
          fi
          curl --fail --silent --show-error \
            --header "x-keepalive-token: $KEEPALIVE_TOKEN" \
            "$APP_URL/api/health"
